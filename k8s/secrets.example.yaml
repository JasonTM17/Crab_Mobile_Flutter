apiVersion: v1
kind: Secret
metadata:
  name: crab-secrets
  namespace: crab
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_IN_PRODUCTION"
  jwt-refresh-secret: "CHANGE_ME_IN_PRODUCTION"
  database-url: "postgresql://crab:CHANGE_ME@postgres:5432/crab"
  mongodb-uri: "mongodb://crab:CHANGE_ME@mongodb:27017/crab"
  redis-url: "redis://:CHANGE_ME@redis:6379"
  google-maps-key: "CHANGE_ME"
  fcm-server-key: "CHANGE_ME"
