apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: crab
  labels:
    app: web-admin
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-admin
  template:
    metadata:
      labels:
        app: web-admin
        tier: frontend
    spec:
      containers:
        - name: web-admin
          image: ghcr.io/jasontm17/crab-web-admin:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-admin
  namespace: crab
spec:
  selector:
    app: web-admin
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
