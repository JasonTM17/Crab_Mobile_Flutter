apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: crab
  labels:
    app: notification-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: backend
    spec:
      containers:
        - name: notification-service
          image: ghcr.io/jasontm17/crab-notification-service:latest
          ports:
            - containerPort: 3007
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3007"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: crab-secrets
                  key: mongodb-uri
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crab-secrets
                  key: redis-url
            - name: FCM_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: crab-secrets
                  key: fcm-server-key
          resources:
            requests:
              cpu: 125m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: crab
spec:
  selector:
    app: notification-service
  ports:
    - port: 3007
      targetPort: 3007
  type: ClusterIP
