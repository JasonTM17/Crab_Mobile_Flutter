apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: crab
  labels:
    app: chat-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
        tier: backend
    spec:
      containers:
        - name: chat-service
          image: ghcr.io/jasontm17/crab-chat-service:latest
          ports:
            - containerPort: 3006
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3006"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: crab-secrets
                  key: mongodb-uri
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: crab-secrets
                  key: redis-url
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: crab
spec:
  selector:
    app: chat-service
  ports:
    - port: 3006
      targetPort: 3006
  type: ClusterIP
