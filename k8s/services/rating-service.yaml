apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: crab
  labels:
    app: rating-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
        tier: backend
    spec:
      containers:
        - name: rating-service
          image: ghcr.io/jasontm17/crab-rating-service:latest
          ports:
            - containerPort: 3008
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3008"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: crab-secrets
                  key: database-url
          resources:
            requests:
              cpu: 125m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3008
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
  namespace: crab
spec:
  selector:
    app: rating-service
  ports:
    - port: 3008
      targetPort: 3008
  type: ClusterIP
