openapi: 3.0.3
info:
  title: Crab Super App API
  description: |
    REST API for the Crab super-app platform.
    Covers ride-hailing, food delivery, payments, chat, and notifications.
  version: 1.0.0
  contact:
    name: Nguyen Son
    email: jasonbmt06@gmail.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.crab.app/api/v1
    description: Production

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Users
    description: User profile management
  - name: Rides
    description: Ride-hailing operations
  - name: Food
    description: Food ordering and restaurant management
  - name: Payments
    description: Wallet and transaction management
  - name: Chat
    description: Real-time messaging
  - name: Notifications
    description: Push and in-app notifications
  - name: Ratings
    description: Reviews and ratings

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and get tokens
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required: [refresh_token]
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'

  /profiles/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    put:
      tags: [Users]
      summary: Update user profile
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'

  /rides:
    post:
      tags: [Rides]
      summary: Request a new ride
      operationId: createRide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'
      responses:
        '201':
          description: Ride created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /rides/history:
    get:
      tags: [Rides]
      summary: Get ride history
      operationId: getRideHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RideStatus'
      responses:
        '200':
          description: Ride history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRides'

  /rides/{rideId}:
    get:
      tags: [Rides]
      summary: Get ride details
      operationId: getRide
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ride details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /rides/{rideId}/cancel:
    post:
      tags: [Rides]
      summary: Cancel a ride
      operationId: cancelRide
      parameters:
        - name: rideId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Ride cancelled

  /restaurants/search:
    get:
      tags: [Food]
      summary: List nearby restaurants
      operationId: listRestaurants
      parameters:
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
            default: 5
        - name: cuisineType
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Restaurant list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRestaurants'

  /menus/items/restaurant/{restaurantId}:
    get:
      tags: [Food]
      summary: Get restaurant menu
      operationId: getMenu
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restaurant menu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'

  /orders:
    post:
      tags: [Food]
      summary: Place a food order
      operationId: createFoodOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodOrderRequest'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodOrder'

  /wallet/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Payments]
      summary: Get wallet balance
      operationId: getWallet
      responses:
        '200':
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'

  /wallet/{userId}/top-up:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Payments]
      summary: Top up wallet
      operationId: topUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
      responses:
        '200':
          description: Top up successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  /transactions/user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Payments]
      summary: Get transaction history
      operationId: getTransactions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema:
            type: string
            enum: [topup, ride_payment, food_payment, refund, withdrawal]
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTransactions'

  /notifications:
    get:
      tags: [Notifications]
      summary: Get notifications
      operationId: getNotifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Notification list

  /ratings:
    post:
      tags: [Ratings]
      summary: Submit a rating
      operationId: createRating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
      responses:
        '201':
          description: Rating submitted

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    RegisterRequest:
      type: object
      required: [email, phone, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/AuthTokens'
        requiresPhoneVerification:
          type: boolean

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [RIDER, DRIVER, MERCHANT, ADMIN]
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            avatarUrl:
              type: string
            dateOfBirth:
              type: string
              format: date
            gender:
              type: string
            bio:
              type: string

    UpdateProfileRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string

    Location:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
        address:
          type: string

    CreateRideRequest:
      type: object
      required: [rider_id, pickup_lat, pickup_lng, pickup_address, dropoff_lat, dropoff_lng, dropoff_address]
      properties:
        rider_id:
          type: string
          format: uuid
        pickup_lat:
          type: number
        pickup_lng:
          type: number
        pickup_address:
          type: string
        dropoff_lat:
          type: number
        dropoff_lng:
          type: number
        dropoff_address:
          type: string

    Ride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RideStatus'
        estimated_fare:
          type: integer
        actual_fare:
          type: integer
        pickup_lat:
          type: number
        pickup_lng:
          type: number
        pickup_address:
          type: string
        dropoff_lat:
          type: number
        dropoff_lng:
          type: number
        dropoff_address:
          type: string
        created_at:
          type: string
          format: date-time

    RideStatus:
      type: string
      enum: [REQUESTED, MATCHED, PICKUP, IN_PROGRESS, COMPLETED, CANCELLED]

    PaginatedRides:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Restaurant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        rating:
          type: number
        deliveryTime:
          type: string
        deliveryFee:
          type: integer
        isOpen:
          type: boolean
        distance:
          type: number

    PaginatedRestaurants:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Restaurant'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    Menu:
      type: object
      properties:
        categories:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              items:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'

    MenuItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        price:
          type: integer
        imageUrl:
          type: string

    CreateFoodOrderRequest:
      type: object
      required: [customerId, restaurantId, items, deliveryLat, deliveryLng, deliveryAddress]
      properties:
        customerId:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            properties:
              menuItemId:
                type: string
              quantity:
                type: integer
              options:
                type: object
        deliveryLat:
          type: number
        deliveryLng:
          type: number
        deliveryAddress:
          type: string
        deliveryNotes:
          type: string
        paymentMethod:
          type: string
        promoCode:
          type: string

    FoodOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PLACED, CONFIRMED, PREPARING, READY, PICKED_UP, DELIVERED, CANCELLED]
        items:
          type: array
          items:
            type: object
        subtotal:
          type: integer
        deliveryFee:
          type: integer
        total:
          type: integer
        estimatedDelivery:
          type: string

    Wallet:
      type: object
      properties:
        balance:
          type: integer
        currency:
          type: string
        lastUpdated:
          type: string
          format: date-time

    TopUpRequest:
      type: object
      required: [amount, paymentMethod]
      properties:
        amount:
          type: integer
          minimum: 10000
        paymentMethod:
          type: string
          enum: [bank_transfer, momo, zalopay, credit_card]
        reference:
          type: string

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        amount:
          type: integer
        description:
          type: string
        createdAt:
          type: string
          format: date-time

    PaginatedTransactions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    CreateRatingRequest:
      type: object
      required: [targetId, targetType, score]
      properties:
        targetId:
          type: string
          format: uuid
        targetType:
          type: string
          enum: [driver, rider, restaurant]
        rideId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    ApiError:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        timestamp:
          type: string
          format: date-time

security:
  - BearerAuth: []
