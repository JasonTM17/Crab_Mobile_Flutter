version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: crab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crab
      POSTGRES_USER: crab
      POSTGRES_PASSWORD: crab_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crab -d crab"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crab-network

  mongodb:
    image: mongo:7
    container_name: crab-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crab-network

  redis:
    image: redis:7-alpine
    container_name: crab-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crab-network

  minio:
    image: minio/minio:latest
    container_name: crab-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: crab_minio
      MINIO_ROOT_PASSWORD: crab_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crab-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  crab-network:
    driver: bridge
