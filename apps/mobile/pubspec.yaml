name: crab_mobile
description: Crab mobile app for ride-hailing, food delivery, wallet, chat, notifications, and profile flows.
publish_to: 'none'
version: 1.0.0+1
homepage: https://github.com/JasonTM17/Crab_Mobile_Flutter
repository: https://github.com/JasonTM17/Crab_Mobile_Flutter
issue_tracker: https://github.com/JasonTM17/Crab_Mobile_Flutter/issues
documentation: https://github.com/JasonTM17/Crab_Mobile_Flutter/tree/main/docs

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Navigation
  go_router: ^17.2.3

  # Networking
  dio: ^5.7.0
  socket_io_client: ^3.1.4

  # Storage
  flutter_secure_storage: ^10.3.0

  # Maps
  google_maps_flutter: ^2.9.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  injectable_generator: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
