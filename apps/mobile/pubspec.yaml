name: crab_mobile
description: Crab - Super App for ride, food delivery, and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^2.4.4

  # Navigation
  go_router: ^17.2.3

  # Networking
  dio: ^5.7.0
  socket_io_client: ^3.1.4

  # Storage
  flutter_secure_storage: ^10.2.0

  # Maps
  google_maps_flutter: ^2.9.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Serialization
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
