services:
  # Infrastructure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crab
      POSTGRES_PASSWORD: crab_secret
      POSTGRES_DB: crab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crab"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: crab
      MONGO_INITDB_ROOT_PASSWORD: crab_secret
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: crab_minio
      MINIO_ROOT_PASSWORD: crab_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # Backend Services
  gateway:
    build:
      context: .
      dockerfile: apps/backend/gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - RIDE_SERVICE_URL=http://ride-service:3003
      - FOOD_SERVICE_URL=http://food-service:3004
      - PAYMENT_SERVICE_URL=http://payment-service:3005
      - CHAT_SERVICE_URL=http://chat-service:3006
      - NOTIFICATION_SERVICE_URL=http://notification-service:3007
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: apps/backend/auth-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://crab:crab_secret@postgres:5432/crab_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev_jwt_secret_change_in_production
      - JWT_REFRESH_SECRET=dev_refresh_secret_change_in_production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: apps/backend/user-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3002
      - DATABASE_URL=postgresql://crab:crab_secret@postgres:5432/crab_db
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=crab_minio
      - MINIO_SECRET_KEY=crab_minio_secret
    depends_on:
      postgres:
        condition: service_healthy

  ride-service:
    build:
      context: .
      dockerfile: apps/backend/ride-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3003
      - DATABASE_URL=postgresql://crab:crab_secret@postgres:5432/crab_db
      - MONGODB_URI=mongodb://crab:crab_secret@mongodb:27017/crab_rides?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  food-service:
    build:
      context: .
      dockerfile: apps/backend/food-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3004
      - DATABASE_URL=postgresql://crab:crab_secret@postgres:5432/crab_db
      - MONGODB_URI=mongodb://crab:crab_secret@mongodb:27017/crab_food?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: apps/backend/payment-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3005
      - DATABASE_URL=postgresql://crab:crab_secret@postgres:5432/crab_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  chat-service:
    build:
      context: .
      dockerfile: apps/backend/chat-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3006
      - MONGODB_URI=mongodb://crab:crab_secret@mongodb:27017/crab_chat?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: apps/backend/notification-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3007
      - MONGODB_URI=mongodb://crab:crab_secret@mongodb:27017/crab_notifications?authSource=admin
      - REDIS_URL=redis://redis:6379
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  rating-service:
    build:
      context: .
      dockerfile: apps/backend/rating-service/Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=3008
      - DATABASE_URL=postgresql://crab:crab_secret@postgres:5432/crab_db
      - MONGODB_URI=mongodb://crab:crab_secret@mongodb:27017/crab_ratings?authSource=admin
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
