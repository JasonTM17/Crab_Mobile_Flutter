global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:3000']

  - job_name: backend-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'auth-service:3001'
          - 'user-service:3002'
          - 'ride-service:3003'
          - 'food-service:3004'
          - 'payment-service:3005'
          - 'chat-service:3006'
          - 'notification-service:3007'
          - 'rating-service:3008'
