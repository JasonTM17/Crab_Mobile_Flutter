apiVersion: apps/v1
kind: Deployment
metadata: { name: rating-service, namespace: crab, labels: { app: rating-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: rating-service } }
  template:
    metadata: { labels: { app: rating-service } }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rating-service
          securityContext:
            allowPrivilegeEscalation: false
          image: nguyenson1710/crab-mobile-rating-service:latest
          ports: [{ containerPort: 3008 }]
          envFrom:
            - configMapRef: { name: crab-config }
            - secretRef: { name: crab-secrets }
          env: [{ name: PORT, value: "3008" }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 3008 }, initialDelaySeconds: 30 }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 3008 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: rating-service, namespace: crab }
spec:
  selector: { app: rating-service }
  ports: [{ port: 3008, targetPort: 3008 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: rating-service-hpa, namespace: crab }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rating-service }
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
