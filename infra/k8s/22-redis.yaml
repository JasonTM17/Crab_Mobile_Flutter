apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: crab, labels: { app: redis } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--maxmemory", "3gb", "--maxmemory-policy", "allkeys-lru"]
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 1, memory: 4Gi }
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: crab }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
