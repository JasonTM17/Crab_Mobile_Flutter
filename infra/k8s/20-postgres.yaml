apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: crab }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: crab-config, key: DB_NAME } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: crab-secrets, key: DB_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: crab-secrets, key: DB_PASSWORD } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 4, memory: 8Gi }
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata: { name: postgres-data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: crab }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
