apiVersion: apps/v1
kind: Deployment
metadata: { name: food-service, namespace: crab, labels: { app: food-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: food-service } }
  template:
    metadata: { labels: { app: food-service } }
    spec:
      containers:
        - name: food-service
          image: jasontm17/food-service:latest
          ports: [{ containerPort: 3004 }]
          envFrom:
            - configMapRef: { name: crab-config }
            - secretRef: { name: crab-secrets }
          env: [{ name: PORT, value: "3004" }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 3004 }, initialDelaySeconds: 30 }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 3004 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: food-service, namespace: crab }
spec:
  selector: { app: food-service }
  ports: [{ port: 3004, targetPort: 3004 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: food-service-hpa, namespace: crab }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: food-service }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
