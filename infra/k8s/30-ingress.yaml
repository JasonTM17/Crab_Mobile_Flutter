apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crab-ingress
  namespace: crab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: api.crab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 3000 }
    - host: admin.crab.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port: { number: 80 }
  tls:
    - hosts:
        - api.crab.example.com
        - admin.crab.example.com
      secretName: crab-tls
