apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service, namespace: crab, labels: { app: auth-service } }
spec:
  replicas: 2
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: crab/auth-service:latest
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: crab-config }
            - secretRef: { name: crab-secrets }
          env: [{ name: PORT, value: "3001" }]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 3001 }, initialDelaySeconds: 30 }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 3001 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service, namespace: crab }
spec:
  selector: { app: auth-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: auth-service-hpa, namespace: crab }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
