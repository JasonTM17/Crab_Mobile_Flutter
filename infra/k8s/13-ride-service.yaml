apiVersion: apps/v1
kind: Deployment
metadata: { name: ride-service, namespace: crab, labels: { app: ride-service } }
spec:
  replicas: 3
  selector: { matchLabels: { app: ride-service } }
  template:
    metadata: { labels: { app: ride-service } }
    spec:
      containers:
        - name: ride-service
          image: crab/ride-service:latest
          ports: [{ containerPort: 3003 }]
          envFrom:
            - configMapRef: { name: crab-config }
            - secretRef: { name: crab-secrets }
          env: [{ name: PORT, value: "3003" }]
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          livenessProbe: { httpGet: { path: /api/v1/health, port: 3003 }, initialDelaySeconds: 30 }
          readinessProbe: { httpGet: { path: /api/v1/health, port: 3003 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: ride-service, namespace: crab }
spec:
  selector: { app: ride-service }
  ports: [{ port: 3003, targetPort: 3003 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ride-service-hpa, namespace: crab }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ride-service }
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
