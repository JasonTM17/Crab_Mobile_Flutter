apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: crab
  labels: { app: web-admin, tier: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web-admin }
  template:
    metadata:
      labels: { app: web-admin, tier: web }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-admin
          securityContext:
            allowPrivilegeEscalation: false
          image: nguyenson1710/crab-mobile-web-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-admin
  namespace: crab
spec:
  selector: { app: web-admin }
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web-admin-hpa
  namespace: crab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web-admin
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
