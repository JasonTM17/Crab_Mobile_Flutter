name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: common-types
            filter: '@crab/common-types'
          - name: socket-events
            filter: '@crab/socket-events'
          - name: backend-shared
            filter: '@crab/backend-shared'
          - name: gateway
            filter: '@crab/gateway'
          - name: auth-service
            filter: '@crab/auth-service'
          - name: user-service
            filter: '@crab/user-service'
          - name: ride-service
            filter: '@crab/ride-service'
          - name: food-service
            filter: '@crab/food-service'
          - name: payment-service
            filter: '@crab/payment-service'
          - name: chat-service
            filter: '@crab/chat-service'
          - name: notification-service
            filter: '@crab/notification-service'
          - name: rating-service
            filter: '@crab/rating-service'
          - name: web-admin
            filter: '@crab/web-admin'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared workspace packages first
        run: |
          pnpm --filter @crab/common-types build
          pnpm --filter @crab/socket-events build
          pnpm --filter @crab/backend-shared build
      - name: Lint workspace package
        run: pnpm --filter "${{ matrix.filter }}" lint
      - name: Build workspace package
        run: pnpm --filter "${{ matrix.filter }}" build

  contract-check:
    name: Contract check
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run contract guardrails
        run: pnpm -w run contract:check

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [lint-and-build, contract-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-shared
            filter: '@crab/backend-shared'
          - name: gateway
            filter: '@crab/gateway'
          - name: auth-service
            filter: '@crab/auth-service'
          - name: user-service
            filter: '@crab/user-service'
          - name: ride-service
            filter: '@crab/ride-service'
          - name: food-service
            filter: '@crab/food-service'
          - name: payment-service
            filter: '@crab/payment-service'
          - name: chat-service
            filter: '@crab/chat-service'
          - name: notification-service
            filter: '@crab/notification-service'
          - name: rating-service
            filter: '@crab/rating-service'
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared workspace packages first
        run: |
          pnpm --filter @crab/common-types build
          pnpm --filter @crab/socket-events build
          pnpm --filter @crab/backend-shared build
      - name: Run package tests
        run: pnpm --filter "${{ matrix.filter }}" test

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: apps/mobile
      - name: Analyze Flutter app
        run: flutter analyze
        working-directory: apps/mobile
      - name: Test Flutter app
        run: flutter test
        working-directory: apps/mobile
