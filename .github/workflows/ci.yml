name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint & Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - common-types
          - socket-events
          - gateway
          - auth-service
          - user-service
          - ride-service
          - food-service
          - payment-service
          - chat-service
          - notification-service
          - rating-service
          - web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build common-types first
        run: pnpm --filter @crab/common-types build
      - name: Lint
        run: |
          if [ "${{ matrix.service }}" = "common-types" ] || [ "${{ matrix.service }}" = "socket-events" ]; then
            pnpm --filter @crab/${{ matrix.service }} lint || true
          elif [ "${{ matrix.service }}" = "web-admin" ]; then
            pnpm --filter web-admin lint || true
          else
            pnpm --filter @crab/${{ matrix.service }} lint || true
          fi
      - name: Build
        run: |
          if [ "${{ matrix.service }}" = "web-admin" ]; then
            pnpm --filter web-admin build
          else
            pnpm --filter @crab/${{ matrix.service }} build
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crab/common-types build
      - run: pnpm test || true

  flutter:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze
        working-directory: apps/mobile
        continue-on-error: true
      - run: flutter test
        working-directory: apps/mobile
        continue-on-error: true
