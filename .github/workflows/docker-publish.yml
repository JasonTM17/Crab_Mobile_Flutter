name: Docker Build and Push

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME || 'nguyenson1710' }}
  IMAGE_PREFIX: crab-mobile

jobs:
  build-and-push:
    name: Build / Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: apps/backend/gateway/Dockerfile
          - service: auth-service
            dockerfile: apps/backend/auth-service/Dockerfile
          - service: user-service
            dockerfile: apps/backend/user-service/Dockerfile
          - service: ride-service
            dockerfile: apps/backend/ride-service/Dockerfile
          - service: food-service
            dockerfile: apps/backend/food-service/Dockerfile
          - service: payment-service
            dockerfile: apps/backend/payment-service/Dockerfile
          - service: chat-service
            dockerfile: apps/backend/chat-service/Dockerfile
          - service: notification-service
            dockerfile: apps/backend/notification-service/Dockerfile
          - service: rating-service
            dockerfile: apps/backend/rating-service/Dockerfile
          - service: web-admin
            dockerfile: apps/web-admin/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Decide publish mode
        id: publish
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets are not configured; publishing to GHCR only."
          fi
      - name: Prepare image names
        id: images
        shell: bash
        run: |
          ghcr_owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "images<<EOF"
            echo "ghcr.io/${ghcr_owner}/${IMAGE_PREFIX}-${{ matrix.service }}"
            if [ "${{ steps.publish.outputs.dockerhub }}" = "true" ]; then
              echo "${DOCKERHUB_NAMESPACE}/${IMAGE_PREFIX}-${{ matrix.service }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
