name: Docker Build and Push

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: docker.io
  NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'nguyenson1710' }}
  IMAGE_PREFIX: crab-mobile

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: apps/backend/gateway/Dockerfile
          - service: auth-service
            dockerfile: apps/backend/auth-service/Dockerfile
          - service: user-service
            dockerfile: apps/backend/user-service/Dockerfile
          - service: ride-service
            dockerfile: apps/backend/ride-service/Dockerfile
          - service: food-service
            dockerfile: apps/backend/food-service/Dockerfile
          - service: payment-service
            dockerfile: apps/backend/payment-service/Dockerfile
          - service: chat-service
            dockerfile: apps/backend/chat-service/Dockerfile
          - service: notification-service
            dockerfile: apps/backend/notification-service/Dockerfile
          - service: rating-service
            dockerfile: apps/backend/rating-service/Dockerfile
          - service: web-admin
            dockerfile: apps/web-admin/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'nguyenson1710' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.NAMESPACE }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
