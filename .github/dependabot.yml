version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "ts-jest"
          - "ts-node"
      testing:
        patterns:
          - "jest"
          - "@jest/*"
          - "supertest"
          - "@types/jest"
      linting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "prettier"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
