version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      typescript:
        patterns: ["typescript", "@types/*", "ts-*"]
      testing:
        patterns: ["jest", "@types/jest", "ts-jest"]
      linting:
        patterns: ["eslint*", "prettier*", "@typescript-eslint/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
